<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazie PRAM</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
    header { background-color: #0056b3; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 1.5rem; }
    button { cursor: pointer; padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; }
    .btn-history { background-color: #ffc107; color: #333; }
    .container { padding: 20px; max-width: 800px; margin: auto; }
    input[type="text"], input[type="number"], input[type="password"], select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    .card h3 { margin: 0 0 5px 0; color: #333; }
    .btn-add { background-color: #28a745; color: white; }
    .btn-remove { background-color: #dc3545; color: white; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
    .close-btn { background: #6c757d; color: white; width: 100%; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .auth-box { background: #eef2f7; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px dashed #0056b3; }
    #statusBar { display: none; padding: 10px; margin-bottom: 15px; border-radius: 5px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>Magazie PRAM</h1>
    <button class="btn-history" onclick="openHistory()">Istoric</button>
  </header>

  <div class="container">
    <div id="statusBar"></div>

    <input type="text" id="searchInput" placeholder="Caută material (ex: cleme, siguranțe)..." onkeyup="filterItems()">
    
    <!-- Butonul minimalist cu "+" -->
    <button id="showFormBtn" onclick="toggleNewItemForm()" style="background: white; border: 2px dashed #0056b3; color: #0056b3; width: 100%; padding: 20px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 20px;">
      <span style="font-size: 2.5rem; line-height: 1; font-weight: bold;">+</span>
      <span style="font-size: 1rem; font-weight: bold;">Adaugă materiale noi în magazie</span>
    </button>

    <!-- Zona de adăugare material nou (Ascunsă inițial) -->
    <div id="newItemFormContainer" style="display: none; background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin: 0;">Adaugă material nou</h3>
        <button onclick="toggleNewItemForm()" style="background: none; border: none; color: #dc3545; font-size: 1rem; padding: 0; cursor: pointer;">✖ Închide</button>
      </div>

      <div class="auth-box">
        <label style="font-size: 0.9rem; font-weight: bold; color: #333;">Verificare electrician:</label>
        <select id="newElectricianName" onchange="onNameChange('new')">
          <option value="">-- Cine adaugă materialul? --</option>
          <option value="Bonați Cătălin Radu">Bonați Cătălin Radu</option>
          <option value="Cristian Cosmin Andrei">Cristian Cosmin Andrei</option>
          <option value="Dicsiuk János Ferencz">Dicsiuk János Ferencz</option>
          <option value="Fedorca Horea Cristian">Fedorca Horea Cristian</option>
          <option value="Fertea Cristian">Fertea Cristian</option>
          <option value="György Melissza">György Melissza</option>
          <option value="Ilyés Oscar">Ilyés Oscar</option>
          <option value="Lakatos László">Lakatos László</option>
          <option value="Pop Mircea">Pop Mircea</option>
          <option value="Sabou Tudor">Sabou Tudor</option>
          <option value="Surduc Lucian Viorel">Surduc Lucian Viorel</option>
          <option value="Traxler Arthur">Traxler Arthur</option>
          <option value="Trif Gabriel Dan">Trif Gabriel Dan</option>
          <option value="Vlad Ioan Alexandru">Vlad Ioan Alexandru</option>
        </select>
        <input type="password" id="newElectricianPin" placeholder="Marcă (ultimele 5 cifre)" maxlength="5" inputmode="numeric">
      </div>

      <input type="text" id="newItemName" placeholder="Nume material nou">
      <input type="number" id="newItemQty" placeholder="Cantitate inițială">
      <button class="btn-add" onclick="addNewItem()" style="width: 100%;">Creează în baza de date</button>
    </div>

    <!-- Lista de inventar (ascunsă implicit până la căutare) -->
    <div id="inventoryList">
      <p style="text-align: center; color: #666;">Începe să tastezi în bara de căutare de mai sus pentru a găsi articolele.</p>
    </div>
  </div>

  <!-- Fereastra pentru Adăugare/Extragere (Tranzacție) -->
  <div id="transactionModal" class="modal">
    <div class="modal-content">
      <h3 id="modalItemName" style="margin-top:0; color:#0056b3;">Nume Material</h3>
      
      <div class="auth-box">
        <label style="font-size: 0.9rem; font-weight: bold; color: #333;">Verificare electrician:</label>
        <select id="electricianName" onchange="onNameChange('modal')">
          <option value="">-- Cine modifică stocul? --</option>
          <option value="Bonați Cătălin Radu">Bonați Cătălin Radu</option>
          <option value="Cristian Cosmin Andrei">Cristian Cosmin Andrei</option>
          <option value="Dicsiuk János Ferencz">Dicsiuk János Ferencz</option>
          <option value="Fedorca Horea Cristian">Fedorca Horea Cristian</option>
          <option value="Fertea Cristian">Fertea Cristian</option>
          <option value="György Melissza">György Melissza</option>
          <option value="Ilyés Oscar">Ilyés Oscar</option>
          <option value="Lakatos László">Lakatos László</option>
          <option value="Pop Mircea">Pop Mircea</option>
          <option value="Sabou Tudor">Sabou Tudor</option>
          <option value="Surduc Lucian Viorel">Surduc Lucian Viorel</option>
          <option value="Traxler Arthur">Traxler Arthur</option>
          <option value="Trif Gabriel Dan">Trif Gabriel Dan</option>
          <option value="Vlad Ioan Alexandru">Vlad Ioan Alexandru</option>
        </select>
        <input type="password" id="electricianPin" placeholder="Marcă (ultimele 5 cifre)" maxlength="5" inputmode="numeric">
      </div>
      
      <input type="number" id="transactionQty" placeholder="Introdu cantitatea">
      
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn-add" style="flex: 1;" onclick="submitTransaction('add')">+ Adaugă</button>
        <button class="btn-remove" style="flex: 1;" onclick="submitTransaction('remove')">- Extrage</button>
      </div>
      <button class="close-btn" onclick="closeModal('transactionModal')">Anulează</button>
    </div>
  </div>

  <!-- Fereastra pentru Istoric -->
  <div id="historyModal" class="modal">
    <div class="modal-content" style="max-width: 600px; max-height: 80vh; overflow-y: auto;">
      <h3 style="margin-top:0;">Istoric magazie</h3>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Nume</th>
            <th>Material</th>
            <th>Buc.</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <!-- Istoricul se va încărca aici -->
        </tbody>
      </table>
      <button class="close-btn" onclick="closeModal('historyModal')">Închide</button>
    </div>
  </div>

  <!-- 1. Funcții de interfață independente -->
  <script>
    const marciValide = {
      "Dicsiuk János Ferencz": "60008571",
      "Traxler Arthur": "60008142",
      "Surduc Lucian Viorel": "60009138",
      "Fedorca Horea Cristian": "60008750",
      "Trif Gabriel Dan": "60010562",
      "Vlad Ioan Alexandru": "60009107",
      "Lakatos László": "60009139",
      "Bonați Cătălin Radu": "60009644",
      "Pop Mircea": "60008745",
      "Cristian Cosmin Andrei": "60010378",
      "György Melissza": "60010567",
      "Sabou Tudor": "60009137",
      "Ilyés Oscar": "60008572",
      "Fertea Cristian": "60008569"
    };

    window.stocuriCurente = {};
    window.currentItemId = '';

    function incarcaDateSalvate() {
      const savedName = localStorage.getItem('pram_user');
      const savedPin = localStorage.getItem('pram_pin');
      if (savedName && marciValide[savedName]) {
        const elModal = document.getElementById('electricianName');
        const elNew = document.getElementById('newElectricianName');
        const pinModal = document.getElementById('electricianPin');
        const pinNew = document.getElementById('newElectricianPin');

        if (elModal) elModal.value = savedName;
        if (elNew) elNew.value = savedName;
        if (savedPin) {
          if (pinModal) pinModal.value = savedPin;
          if (pinNew) pinNew.value = savedPin;
        }
      }
    }

    window.addEventListener('DOMContentLoaded', incarcaDateSalvate);

    window.onNameChange = function(tip) {
      const savedName = localStorage.getItem('pram_user');
      const savedPin = localStorage.getItem('pram_pin');
      if (tip === 'modal') {
        const currentName = document.getElementById('electricianName').value;
        document.getElementById('electricianPin').value = (currentName === savedName && savedPin) ? savedPin : '';
      } else {
        const currentName = document.getElementById('newElectricianName').value;
        document.getElementById('newElectricianPin').value = (currentName === savedName && savedPin) ? savedPin : '';
      }
    };

    window.verificaElectrician = function(nume, pin) {
      if (!nume) {
        alert("Te rog selectează numele!");
        return false;
      }
      if (!pin) {
        alert("Te rog introdu ultimele 5 cifre din marcă!");
        return false;
      }
      
      const marcaCompleta = marciValide[nume];
      const ultimele5 = marcaCompleta ? marcaCompleta.slice(-5) : '';

      if (pin.trim() !== ultimele5) {
        alert("Ultimele 5 cifre din marcă sunt incorecte pentru numele selectat! Acces respins.");
        return false;
      }
      
      localStorage.setItem('pram_user', nume);
      localStorage.setItem('pram_pin', pin.trim());
      return true;
    };

    window.toggleNewItemForm = function() {
      const form = document.getElementById("newItemFormContainer");
      const btn = document.getElementById("showFormBtn");
      if (form.style.display === "none" || form.style.display === "") {
        incarcaDateSalvate();
        form.style.display = "block";
        btn.style.display = "none";
      } else {
        form.style.display = "none";
        btn.style.display = "flex";
      }
    };

    window.openTransactionModal = function(id) {
      const item = window.stocuriCurente[id];
      if (!item) return;
      window.currentItemId = id;
      document.getElementById("modalItemName").innerText = item.nume;
      document.getElementById("transactionQty").value = '';
      incarcaDateSalvate();
      document.getElementById("transactionModal").style.display = "flex";
    };

    window.filterItems = function() {
      const input = document.getElementById("searchInput").value.toLowerCase().trim();
      const cards = document.getElementsByClassName("item-card");
      
      if (input === "") {
        for (let i = 0; i < cards.length; i++) {
          cards[i].style.display = "none";
        }
        return;
      }

      for (let i = 0; i < cards.length; i++) {
        const name = cards[i].getElementsByClassName("item-name")[0].innerText.toLowerCase();
        if (name.includes(input)) {
          cards[i].style.display = "flex";
        } else {
          cards[i].style.display = "none";
        }
      }
    };

    window.openHistory = function() { document.getElementById("historyModal").style.display = "flex"; };
    window.closeModal = function(id) { document.getElementById(id).style.display = "none"; };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>

  <!-- 2. Logica și conexiunea cu Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCpQBd3uUKxJ13WRVWU8mU7lknG2cN8b7k",
      authDomain: "magazie-pram.firebaseapp.com",
      projectId: "magazie-pram",
      storageBucket: "magazie-pram.firebasestorage.app",
      messagingSenderId: "1050395080468",
      appId: "1:1050395080468:web:ed32c736f61e7a1e7f7401"
    };

    const statusBar = document.getElementById("statusBar");
    function afiseazaEroare(mesaj) {
      statusBar.style.display = "block";
      statusBar.style.backgroundColor = "#f8d7da";
      statusBar.style.color = "#721c24";
      statusBar.innerText = mesaj;
    }

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      onSnapshot(collection(db, "stocuri"), (snapshot) => {
        statusBar.style.display = "none";
        const list = document.getElementById("inventoryList");
        list.innerHTML = '';
        window.stocuriCurente = {};

        if (snapshot.empty) {
          list.innerHTML = '<p style="text-align: center; color: #666;">Magazia este goală. Adaugă primul material folosind butonul + de mai sus.</p>';
          window.filterItems();
          return;
        }

        // Transformăm datele într-un array și le sortăm alfabetic după nume
        const materiale = [];
        snapshot.forEach((docSnap) => {
          materiale.push({ id: docSnap.id, ...docSnap.data() });
        });

        materiale.sort((a, b) => a.nume.localeCompare(b.nume, 'ro', { sensitivity: 'base' }));

        materiale.forEach((item) => {
          const id = item.id;
          window.stocuriCurente[id] = item;

          const card = document.createElement('div');
          card.className = 'card item-card';
          card.innerHTML = `
            <div>
              <h3 class="item-name"></h3>
              <p style="margin:0; color:#555;">Stoc: <strong>${item.cantitate}</strong> buc.</p>
            </div>
            <div>
              <button class="btn-history" onclick="openTransactionModal('${id}')">Modifică</button>
            </div>
          `;
          card.querySelector('.item-name').textContent = item.nume;
          list.appendChild(card);
        });
        window.filterItems();
      }, (error) => {
        afiseazaEroare("Eroare conexiune baza de date (" + error.code + "). Verifică tab-ul Rules în Firebase să aibă allow read, write: if true;");
      });

      const q = query(collection(db, "istoric"), orderBy("data", "desc"));
      onSnapshot(q, (snapshot) => {
        const tbody = document.getElementById("historyTableBody");
        tbody.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const tx = docSnap.data();
          const dateStr = tx.data ? tx.data.toDate().toLocaleString('ro-RO', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : 'Acum';
          const color = (tx.tip === 'add' || tx.tip === 'create') ? '#28a745' : '#dc3545';
          const sign = tx.tip === 'add' ? '+' : (tx.tip === 'create' ? 'NOU ' : '-');
          
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${dateStr}</td>
            <td class="tx-el"></td>
            <td class="tx-mat"></td>
            <td style="color: ${color}; font-weight: bold;">${sign}${tx.cantitate}</td>
          `;
          tr.querySelector('.tx-el').textContent = tx.electrician;
          tr.querySelector('.tx-mat').textContent = tx.material;
          tbody.appendChild(tr);
        });
      });

      window.addNewItem = async function() {
        const nume = document.getElementById("newItemName").value.trim();
        const cantitate = parseInt(document.getElementById("newItemQty").value);
        const electrician = document.getElementById("newElectricianName").value;
        const pin = document.getElementById("newElectricianPin").value;

        if (!window.verificaElectrician(electrician, pin)) return;
        if (!nume || isNaN(cantitate) || cantitate < 0) { alert("Introdu un nume de material și o cantitate validă."); return; }

        try {
          window.toggleNewItemForm();
          await addDoc(collection(db, "stocuri"), { nume: nume, cantitate: cantitate });
          await addDoc(collection(db, "istoric"), {
            material: nume,
            electrician: electrician,
            cantitate: cantitate,
            tip: 'create',
            data: serverTimestamp()
          });
          document.getElementById("newItemName").value = '';
          document.getElementById("newItemQty").value = '';
        } catch (err) {
          alert("Eroare la salvare: " + err.message);
        }
      };

      window.submitTransaction = async function(tip) {
        const item = window.stocuriCurente[window.currentItemId];
        if (!item) return;

        const qty = parseInt(document.getElementById("transactionQty").value);
        const electrician = document.getElementById("electricianName").value;
        const pin = document.getElementById("electricianPin").value;

        if (!window.verificaElectrician(electrician, pin)) return;
        if (!qty || qty <= 0) { alert("Introdu o cantitate mai mare ca zero!"); return; }

        let newStock = item.cantitate;
        if (tip === 'add') {
          newStock += qty;
        } else if (tip === 'remove') {
          if (qty > item.cantitate) { alert("Atenție! Nu poți extrage mai mult decât ai pe stoc."); return; }
          newStock -= qty;
        }

        window.closeModal('transactionModal');

        try {
          await updateDoc(doc(db, "stocuri", window.currentItemId), { cantitate: newStock });
          await addDoc(collection(db, "istoric"), {
            material: item.nume,
            electrician: electrician,
            cantitate: qty,
            tip: tip,
            data: serverTimestamp()
          });
        } catch (err) {
          alert("Eroare la actualizarea stocului: " + err.message);
        }
      };

    } catch (e) {
      afiseazaEroare("Eroare inițializare: " + e.message);
    }
  </script>
</body>
</html>
